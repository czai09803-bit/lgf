<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>每日练功房</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#eef1ee">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="练功房">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@600;700&family=Noto+Sans+SC:wght@400;500;700&family=Fraunces:opsz,wght@9..144,500;600&display=swap">
<style>
/* Layout: phone app — soft glowing ground, frosted cards, floating tab bar; every module = theme chips → question → answer → review
   Mood: calm, airy, “a quiet room to practise in”. Sage / mist blue / apricot / dusk lilac on a misty ground; night mode is deep slate with soft light. */
:root{
  --bg:#eef1ee; --ink:#1d2a31; --muted:#67767e; --faint:#97a3a9;
  --surface:rgba(255,255,255,.74); --solid:#fbfcfb; --edge:rgba(255,255,255,.85); --line:rgba(29,52,62,.09); --chat:rgba(232,238,235,.75);
  --shadow:0 1px 2px rgba(28,48,58,.04),0 10px 30px -12px rgba(28,48,58,.16);
  --shadow-lg:0 2px 6px rgba(28,48,58,.05),0 24px 48px -18px rgba(28,48,58,.25);
  --eq:#3b8b72; --eq-soft:#e0efe8; --es:#bd7f3c; --es-soft:#f6eadb; --think:#5375ab; --think-soft:#e2e9f5; --know:#8667b2; --know-soft:#ede6f6;
  --warn:#c06648; --warn-soft:#f8e7df; --gold:#c49a3e; --bubble-out:#d6ecdf; --on-acc:#fff;
  --glow1:rgba(126,192,166,.34); --glow2:rgba(147,170,222,.30); --glow3:rgba(203,176,226,.24);
  --acc:var(--eq); --acc-soft:var(--eq-soft);
  --display:"Noto Serif SC","Songti SC",serif;
  --body:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  --num:"Fraunces","Noto Serif SC",Georgia,serif;
  --r:20px; --r-sm:14px; --ease:cubic-bezier(.2,.75,.25,1);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f151b; --ink:#e3eaed; --muted:#93a1a9; --faint:#66737b;
  --surface:rgba(27,35,43,.72); --solid:#18212a; --edge:rgba(255,255,255,.06); --line:rgba(255,255,255,.08); --chat:rgba(16,22,28,.6);
  --shadow:0 1px 2px rgba(0,0,0,.2),0 12px 30px -14px rgba(0,0,0,.6); --shadow-lg:0 24px 48px -18px rgba(0,0,0,.7);
  --eq:#7cc7aa; --eq-soft:rgba(124,199,170,.14); --es:#e2ad74; --es-soft:rgba(226,173,116,.14); --think:#94b2e2; --think-soft:rgba(148,178,226,.14); --know:#bba2df; --know-soft:rgba(187,162,223,.15);
  --warn:#eb9a7c; --warn-soft:rgba(235,154,124,.14); --gold:#e2c27a; --bubble-out:rgba(124,199,170,.2); --on-acc:#0e1a1f;
  --glow1:rgba(84,160,132,.20); --glow2:rgba(88,112,180,.22); --glow3:rgba(130,96,170,.18); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f151b; --ink:#e3eaed; --muted:#93a1a9; --faint:#66737b;
  --surface:rgba(27,35,43,.72); --solid:#18212a; --edge:rgba(255,255,255,.06); --line:rgba(255,255,255,.08); --chat:rgba(16,22,28,.6);
  --shadow:0 1px 2px rgba(0,0,0,.2),0 12px 30px -14px rgba(0,0,0,.6); --shadow-lg:0 24px 48px -18px rgba(0,0,0,.7);
  --eq:#7cc7aa; --eq-soft:rgba(124,199,170,.14); --es:#e2ad74; --es-soft:rgba(226,173,116,.14); --think:#94b2e2; --think-soft:rgba(148,178,226,.14); --know:#bba2df; --know-soft:rgba(187,162,223,.15);
  --warn:#eb9a7c; --warn-soft:rgba(235,154,124,.14); --gold:#e2c27a; --bubble-out:rgba(124,199,170,.2); --on-acc:#0e1a1f;
  --glow1:rgba(84,160,132,.20); --glow2:rgba(88,112,180,.22); --glow3:rgba(130,96,170,.18); color-scheme:dark}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.65 var(--body);-webkit-text-size-adjust:100%;-webkit-font-smoothing:antialiased;min-height:100vh}
[hidden]{display:none!important}
.glow{position:fixed;inset:0;z-index:0;pointer-events:none;
  background:radial-gradient(60% 38% at 8% -4%,var(--glow1),transparent 70%),radial-gradient(55% 34% at 100% 6%,var(--glow2),transparent 70%),radial-gradient(70% 40% at 50% 108%,var(--glow3),transparent 70%)}
a{color:inherit}
.hint a,.note a{color:var(--acc);font-weight:700;text-decoration:none;border-bottom:1px solid currentColor}
.m-eq{--acc:var(--eq);--acc-soft:var(--eq-soft)}
.m-es{--acc:var(--es);--acc-soft:var(--es-soft)}
.m-think,.m-ana{--acc:var(--think);--acc-soft:var(--think-soft)}
.m-know{--acc:var(--know);--acc-soft:var(--know-soft)}
main{position:relative;z-index:1;max-width:560px;margin:0 auto;padding-top:max(20px,env(safe-area-inset-top,0px));padding-bottom:calc(108px + env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.view{display:flex;flex-direction:column;gap:14px;min-width:0}
#app.enter>.view{animation:rise .42s var(--ease) both}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}

h1{font-family:var(--display);font-weight:700;font-size:27px;line-height:1.25;margin:0;letter-spacing:.03em;text-wrap:balance}
h2{font-family:var(--display);font-weight:600;font-size:18px;line-height:1.4;margin:0;letter-spacing:.02em;text-wrap:balance}
.sub{color:var(--muted);font-size:13px;margin:4px 0 0;letter-spacing:.02em}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;padding:4px 2px 2px}

/* surfaces */
.card,.scene,.genbar,.seg,.task,.kitem,.flash,.tipc{background:var(--surface);border:1px solid var(--edge);box-shadow:var(--shadow);
  -webkit-backdrop-filter:blur(18px) saturate(1.25);backdrop-filter:blur(18px) saturate(1.25)}
.card{border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:12px;min-width:0}
.scene{border-radius:var(--r);overflow:hidden}
.scene-head{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:8px;align-items:center}
.scene-head b{font-weight:700;letter-spacing:.02em}
.ctx{font-size:13px;color:var(--muted);padding:12px 16px 0;margin:0}
.chat{background:var(--chat);padding:16px;display:flex;flex-direction:column;gap:10px;margin-top:12px}
.msg{max-width:84%;padding:9px 13px;border-radius:16px;line-height:1.55;overflow-wrap:anywhere;animation:msgin .3s var(--ease) both}
.msg.in{align-self:flex-start;background:var(--solid);border-bottom-left-radius:6px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.msg.out{align-self:flex-end;background:var(--bubble-out);border-bottom-right-radius:6px}
@keyframes msgin{from{opacity:0;transform:translateY(6px) scale(.98)}to{opacity:1;transform:none}}
.msg .zh{display:block;font-size:12px;color:var(--muted);margin-top:4px}
.msg .fix{display:block;font-size:12px;color:var(--warn);margin-top:4px}

/* controls */
.seg{display:flex;gap:4px;border-radius:16px;padding:4px}
.seg button{flex:1;border:0;background:none;padding:9px 4px;border-radius:12px;font:500 14px var(--body);color:var(--muted);cursor:pointer;transition:background .25s,color .25s}
.seg button.on{background:var(--acc);color:var(--on-acc);box-shadow:0 6px 14px -8px var(--acc)}
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 2px 4px;scrollbar-width:none;margin:0 -2px;scroll-snap-type:x proximity}
.chips::-webkit-scrollbar{display:none}
.chips button{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:99px;padding:6px 14px;font:13px var(--body);cursor:pointer;transition:all .2s;scroll-snap-align:start}
.chips button.on{border-color:transparent;background:var(--acc-soft);color:var(--acc);font-weight:700;box-shadow:inset 0 0 0 1px var(--acc)}
.btn{border:0;border-radius:var(--r-sm);padding:12px 18px;font:700 15px var(--body);letter-spacing:.04em;cursor:pointer;flex:1;text-align:center;text-decoration:none;color:var(--on-acc);
  background:var(--acc);background:linear-gradient(180deg,color-mix(in srgb,var(--acc) 86%,#fff),var(--acc));
  box-shadow:0 8px 18px -10px var(--acc);transition:transform .15s var(--ease),box-shadow .2s,opacity .2s}
.btn:active,.opt:active,.task:active,.kitem:active,.chips button:active,.seg button:active{transform:scale(.97)}
.btn.ghost{background:transparent;color:var(--acc);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--acc) 55%,transparent);flex:0 0 auto}
.btn:disabled{opacity:.45;cursor:default}
.row{display:flex;gap:8px;flex-wrap:wrap}
.hint{font-size:12px;color:var(--muted);margin:0;line-height:1.6}
.lbl{font-size:13px;color:var(--muted)}
textarea,input{width:100%;border:1px solid var(--line);border-radius:var(--r-sm);padding:11px 14px;font:15px/1.55 var(--body);background:var(--solid);color:var(--ink);transition:border-color .2s,box-shadow .2s}
textarea{min-height:88px;resize:vertical}
textarea:focus,input:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 4px var(--acc-soft)}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.tag{font-size:12px;padding:2px 10px;border-radius:99px;background:var(--acc-soft);color:var(--acc);white-space:nowrap}
.src{font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:99px;padding:1px 8px;white-space:nowrap}
.frame{font-size:13px;color:var(--muted);border:1px dashed color-mix(in srgb,var(--acc) 40%,var(--line));border-radius:var(--r-sm);padding:10px 14px;background:var(--acc-soft)}
.frame b{color:var(--acc)}
.mini{align-self:flex-start;font:12px var(--body);border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:99px;padding:4px 12px;cursor:pointer;text-decoration:none}
.status{font-size:14px;color:var(--muted);display:flex;align-items:center;gap:10px}
.spin{width:16px;height:16px;border:2px solid var(--line);border-top-color:var(--acc);border-radius:50%;animation:s .9s linear infinite;flex:0 0 auto}
@keyframes s{to{transform:rotate(360deg)}}

/* review */
.score-top{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.total{font-family:var(--num);font-weight:600;font-size:52px;line-height:1;color:var(--acc);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.total small{font:400 15px var(--body);color:var(--muted);letter-spacing:0}
.dims{flex:1;min-width:180px;display:grid;gap:8px}
.dim{display:grid;grid-template-columns:4.4em 1fr 1.4em;align-items:center;gap:8px;font-size:13px}
.bar{height:6px;background:var(--line);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,color-mix(in srgb,var(--acc) 55%,transparent),var(--acc));border-radius:99px;animation:grow .9s var(--ease) both;transform-origin:left}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
.dim span:last-child{text-align:right;font-variant-numeric:tabular-nums;font-family:var(--num)}
.read{display:grid;gap:8px}
.read div{font-size:14px;padding:10px 12px;border-radius:12px;background:var(--acc-soft)}
.read b{color:var(--acc);margin-right:6px}
.note{font-size:14px;margin:0}
.note.bad{background:var(--warn-soft);border-radius:12px;padding:10px 12px}
.note.bad b{color:var(--warn)}
.alt{border-top:1px solid var(--line);padding-top:14px;display:flex;flex-direction:column;gap:6px}
.alt .lab{font-size:12px;color:var(--acc);font-weight:700;letter-spacing:.08em}
.alt .txt{white-space:pre-line;background:var(--acc-soft);padding:10px 14px;border-radius:14px;align-self:flex-start;overflow-wrap:anywhere}
.alt .why{font-size:13px;color:var(--muted)}

/* options & feedback */
.opts{display:flex;flex-direction:column;gap:8px}
.opt{text-align:left;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:var(--r-sm);padding:12px 14px;font:15px/1.55 var(--body);cursor:pointer;transition:transform .15s var(--ease),border-color .2s,background .2s,opacity .3s}
.opt.good{border-color:var(--eq);background:var(--eq-soft);animation:okpop .6s var(--ease)}
.opt.bad{border-color:var(--warn);background:var(--warn-soft);animation:shake .42s}
.opt.dim2{opacity:.5}
.opt .k{font-family:var(--num);font-weight:600;color:var(--faint);margin-right:8px}
@keyframes okpop{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--eq) 45%,transparent);transform:scale(1)}40%{transform:scale(1.015)}100%{box-shadow:0 0 0 14px transparent;transform:none}}
@keyframes shake{0%,100%{transform:none}20%{transform:translateX(-6px)}40%{transform:translateX(5px)}60%{transform:translateX(-3px)}80%{transform:translateX(2px)}}
.kpts{margin:0;padding-left:1.2em;display:grid;gap:4px;font-size:14px}
.kpts li::marker{color:var(--acc)}
.essay{font-size:15.5px;line-height:1.9;margin:0;letter-spacing:.01em}

/* home dashboard */
.hello{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:6px 2px 0}
.hello h1{font-size:25px}
.hello .actions{display:flex;gap:6px;flex:0 0 auto}
.iconbtn{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--surface);border:1px solid var(--edge);box-shadow:var(--shadow);text-decoration:none;color:var(--muted);font-size:16px}
.hero{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center}
.ring{position:relative;width:118px;height:118px;flex:0 0 auto}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .trk{fill:none;stroke:var(--line);stroke-width:10}
.ring .val{fill:none;stroke:url(#rg);stroke-width:10;stroke-linecap:round;transition:stroke-dashoffset 1.2s var(--ease)}
.ring .mid{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.ring .mid b{font:600 32px/1 var(--num)}
.ring .mid span{font-size:11px;color:var(--muted);letter-spacing:.1em;margin-top:4px}
.hero .facts{display:grid;gap:10px;min-width:0}
.fact{display:flex;align-items:baseline;gap:8px}
.fact b{font:600 24px/1 var(--num);font-variant-numeric:tabular-nums}
.fact span{font-size:12px;color:var(--muted)}
.fact.streak b{color:var(--gold)}
.tipc{border-radius:var(--r);padding:14px 16px;display:flex;gap:12px;align-items:flex-start;background:linear-gradient(135deg,color-mix(in srgb,var(--eq-soft) 90%,transparent),var(--surface))}
.tipc .av{width:34px;height:34px;flex:0 0 auto;border-radius:50%;display:grid;place-items:center;background:var(--eq);color:var(--on-acc);font:700 15px var(--display)}
.tipc .tx{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.tipt{font-family:var(--display);color:var(--eq);font-size:13px;letter-spacing:.06em}
.sec{display:flex;justify-content:space-between;align-items:baseline;padding:6px 4px 0}
.sec h2{font-size:16px}
.sec a{font-size:12px;color:var(--muted);text-decoration:none}
.dash2{display:grid;grid-template-columns:1fr;gap:12px}
.dash2 .radar{max-width:300px;margin:0 auto}
@media (min-width:540px){.dash2{grid-template-columns:1fr 1fr}}
.radar{width:100%;max-width:100%;height:auto;display:block}
.radar text{font:11px var(--body);fill:var(--muted)}
.tracks{display:grid;gap:12px}
.trk-row{display:grid;grid-template-columns:30px 1fr;gap:10px;align-items:center}
.trk-row .g{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;background:var(--acc-soft);color:var(--acc);font:700 14px var(--display)}
.trk-row .top{display:flex;justify-content:space-between;font-size:13px;gap:6px}
.trk-row .top b{font-weight:700}
.trk-row .top span{color:var(--muted);font-size:12px;white-space:nowrap}
.trk-row .bar{height:5px;margin-top:5px}
.trk-row .top span.lvlpill{color:var(--acc);font-size:11px;margin-left:4px}
.task{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;border-radius:18px;padding:12px 14px;cursor:pointer;text-align:left;font:inherit;color:inherit;width:100%;text-decoration:none;transition:transform .15s var(--ease)}
.task .ic{width:44px;height:44px;border-radius:14px;background:var(--acc-soft);color:var(--acc);display:grid;place-items:center;font:700 17px var(--display);position:relative}
.task.done .ic{background:var(--acc);color:var(--on-acc)}
.task.done .ic::after{content:"✓";position:absolute;right:-4px;bottom:-4px;width:18px;height:18px;border-radius:50%;background:var(--solid);color:var(--acc);font:700 11px/18px var(--body);text-align:center;box-shadow:0 1px 3px rgba(0,0,0,.15)}
.task .t{font-weight:700}
.task .d{font-size:12px;color:var(--muted)}
.task .st{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;text-align:right}
.task.done .st{color:var(--acc);font-weight:700}
.task.done{opacity:.86}
.prog{height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--eq);transition:width .6s var(--ease)}
.streak{text-align:right;font-size:13px;color:var(--muted)}
.streak b{font-family:var(--num);font-size:26px;color:var(--gold);font-variant-numeric:tabular-nums}

/* flash cards + swipe */
.flash{position:relative;border-radius:24px;min-height:230px;padding:28px 20px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;cursor:pointer;
  touch-action:none;user-select:none;-webkit-user-select:none;transition:transform .35s var(--ease),opacity .35s;will-change:transform}
.flash.drag{transition:none}
#fl{animation:cardin .4s var(--ease)}
@keyframes cardin{from{opacity:0;transform:translateY(10px) scale(.97)}to{opacity:1;transform:none}}
.flash.cz{touch-action:auto;cursor:default;user-select:text;-webkit-user-select:text}
.flash .es{font-family:var(--display);font-size:31px;font-weight:700;color:var(--acc);overflow-wrap:anywhere;letter-spacing:.01em}
.flash .zh{font-size:17px;font-weight:700}
.flash .ex{font-size:14px;color:var(--muted)}
.flash .ty{font-size:11px;color:var(--acc);border:1px solid color-mix(in srgb,var(--acc) 50%,transparent);border-radius:99px;padding:1px 10px;letter-spacing:.06em}
.flash.flipin{animation:flipin .45s var(--ease)}
@keyframes flipin{from{transform:rotateY(-70deg);opacity:.2}to{transform:none;opacity:1}}
.stamp{position:absolute;top:16px;padding:4px 12px;border-radius:10px;font:700 15px var(--body);letter-spacing:.1em;opacity:0;pointer-events:none;border:2px solid currentColor}
.stamp.r{left:16px;color:var(--eq);transform:rotate(-10deg)}
.stamp.l{right:16px;color:var(--warn);transform:rotate(10deg)}
.stamp.u{left:50%;top:auto;bottom:16px;transform:translateX(-50%);color:var(--think)}
.swipehint{text-align:center;font-size:12px;color:var(--faint);margin:-4px 0 0}
.rate{display:flex;gap:8px}
.rate button{flex:1;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--surface);color:var(--ink);padding:11px 4px;font:700 14px var(--body);cursor:pointer;transition:transform .15s}
.rate button:active{transform:scale(.96)}
.rate button:first-child{color:var(--warn)}
.rate button:last-child{background:var(--acc);color:var(--on-acc);border-color:transparent}
.say{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:5px 14px;font:13px var(--body);color:var(--acc);cursor:pointer}
.clz{font-size:18px;line-height:2.1;overflow-wrap:anywhere}
.clz input{display:inline-block;width:auto;max-width:100%;padding:2px 10px;margin:0 2px;border-radius:10px;border:2px solid var(--acc);font-size:17px;text-align:center;background:var(--solid)}
.a-ok{color:var(--eq)}.a-bad{color:var(--warn)}
.lvbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.lvs{display:flex;gap:4px;flex:1;min-width:0;background:var(--surface);border:1px solid var(--edge);border-radius:14px;padding:3px}
.lvs button{flex:1;min-width:0;border:0;background:none;color:var(--muted);border-radius:11px;padding:6px 0;font:600 14px var(--num);cursor:pointer;transition:all .2s}
.lvs button.on{background:var(--acc);color:var(--on-acc)}
.lvbar .mini{color:var(--acc);border-color:color-mix(in srgb,var(--acc) 50%,transparent)}

/* overlays */

function shuffled(n){const a=[...Array(n).keys()];for(let i=n-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function shufOpts(o){if(!o||!Array.isArray(o.opts))return o;const key="ans" in o?"ans":"bad" in o?"bad":null;if(!key||!Number.isInteger(+o[key]))return o;
  const ord=shuffled(o.opts.length),r={...o,opts:ord.map(i=>o.opts[i]),[key]:ord.indexOf(+o[key])};if(Array.isArray(o.notes)&&o.notes.length===o.opts.length)r.notes=ord.map(i=>o.notes[i]);return r}

function pickBuiltin(pool,k,theme,filter,allowReset=true){
  let list=poolList(pool,theme,filter);
  if(!list.length){if(!allowReset)return null;list=pool}
  let done=store.get("lgf-done-"+k,[]),left=list.filter(x=>!done.includes(itemKey(x))),again=false;
  if(!left.length){if(!allowReset)return null;const keys=new Set(list.map(itemKey));done=done.filter(d=>!keys.has(d));left=list;again=true}
  const cur=store.get("lgf-cur-"+k,null);if(left.length>1&&cur)left=left.filter(x=>itemKey(x)!==itemKey(cur));
  const it=rnd(left);done.push(itemKey(it));store.set("lgf-done-"+k,done.slice(-1500));
  return {...shufItem(it),src:"题库",again}}

/* clean model output: drop hidden reasoning blocks, render light markdown safely */
function cleanAI(t){t=String(t==null?"":t);
  t=t.replace(/<(think|thinking|reasoning)>[\s\S]*?<\/\1>/gi,"");
  const m=t.match(/<\/(think|thinking|reasoning)>/i);if(m)t=t.slice(t.lastIndexOf(m[0])+m[0].length);
  t=t.replace(/<(think|thinking|reasoning)>[\s\S]*$/i,"");
  return t.replace(/^\s+|\s+$/g,"")}
function md(t){let h=esc(cleanAI(t));
  h=h.replace(/^#{1,6}\s*(.+)$/gm,"<b>$1</b>").replace(/\*\*([^*\n]+?)\*\*/g,"<b>$1</b>").replace(/__([^_\n]+?)__/g,"<b>$1</b>")
   .replace(/^\s*[-*•]\s+/gm,"• ").replace(/^\s*(\d+)[.、)]\s+/gm,"$1. ").replace(/`([^`\n]+)`/g,"$1").replace(/^-{3,}$/gm,"")
   .replace(/\n{3,}/g,"\n\n").replace(/\n/g,"<br>");return h}
const plain=t=>cleanAI(t).replace(/\*\*|__|`|^#{1,6}\s*/gm,"");
async function callApi(messages,signal,temp=.6,opts={}){
  const c=cfg(),stream=!!opts.onProgress;let res;
  try{res=await fetch(endpoint(c.base),{method:"POST",signal,headers:{"Content-Type":"application/json","Authorization":"Bearer "+c.key.trim()},
    body:JSON.stringify({model:(opts.model||c.model).trim(),temperature:temp,messages,...(stream?{stream:true}:{})})})}
  catch(e){if(e.name==="AbortError")throw e;throw{code:"network"}}
  if(!res.ok){let msg="";try{const j=await res.json();msg=j.error?.message||j.message||""}catch(_){}throw{code:"http",status:res.status,msg}}
  if(stream&&res.body&&/event-stream/i.test(res.headers.get("content-type")||"")){
    const rd=res.body.getReader(),dec=new TextDecoder();let buf="",out="",think=0;
    for(;;){let r;try{r=await rd.read()}catch(e){if(e&&e.name==="AbortError")throw e;throw{code:"network",mid:true}}const {done,value}=r;if(done)break;buf+=dec.decode(value,{stream:true});let i;
      while((i=buf.indexOf("\n"))>=0){const line=buf.slice(0,i).trim();buf=buf.slice(i+1);if(!line.startsWith("data:"))continue;const d=line.slice(5).trim();if(!d||d==="[DONE]")continue;
        try{const j=JSON.parse(d),dl=j.choices?.[0]?.delta||j.choices?.[0]?.message||{};if(dl.content)out+=dl.content;const rc=dl.reasoning_content||dl.reasoning;if(rc)think+=String(rc).length;
          const inThink=/<think/i.test(out)&&!/<\/think/i.test(out);opts.onProgress(inThink?0:cleanAI(out).length,think>0||inThink)}catch(_){}}}
    const t=cleanAI(out);if(!t)throw{code:"empty"};return t}
  const j=await res.json();const t=cleanAI(j.choices?.[0]?.message?.content);if(!t)throw{code:"empty"};return t}
function parseJSON(t){t=String(t).trim().replace(/^```(?:json)?\s*/i,"").replace(/```\s*$/,"");
  try{return JSON.parse(t)}catch(_){}const a=t.indexOf("{"),b=t.lastIndexOf("}");
  if(a>=0&&b>a){try{return JSON.parse(t.slice(a,b+1))}catch(_){}}return null}
async function askJSON(prompt,signal,temp,opts){
  const t=await callApi([{role:"system",content:"你只输出合法的 JSON，不要任何解释或代码块标记。"},{role:"user",content:prompt}],signal,temp,opts);
  const r=parseJSON(t);if(!r)throw{code:"invalid_json"};return unmark(r)}
function unmark(o){if(typeof o==="string")return o.replace(/\*\*([^*]+)\*\*/g,"$1").replace(/__([^_]+)__/g,"$1");if(Array.isArray(o))return o.map(unmark);if(o&&typeof o==="object"){for(const k in o)o[k]=unmark(o[k])}return o}
function errText(e){
  if(!e)return"未知错误";
  if(e.code==="network")return"网络或跨域错误：接口没连上，或这家接口不允许网页直接调用。";
  if(e.code==="http"){if(e.status===401||e.status===403)return"Key 无效或没有权限（"+e.status+"），到“我的”里检查。";
    if(e.status===404)return"地址或模型名不对（404）。"+(e.msg||"");if(e.status===429)return"请求太频繁或余额不足（429）。"+(e.msg||"");
    return"接口返回错误 "+e.status+"。"+(e.msg||"")}
  if(e.code==="invalid_json"||e.code==="bad")return"AI 没按格式返回，再试一次。";
  if(e.code==="empty")return"AI 只返回了思考过程，没给出答案，再试一次。如果经常这样，可以在设置里换成不带“深度思考”的模型（比如 deepseek-chat）。";return"未知错误"}

function startJob(k,a,pre){
  if(JOBS[k])return JOBS[k];
  const th=a.theme==="随机"?rnd(TH[THK[k]||k]||["生活"]):a.theme;
  const ac=new AbortController(),job={k,th,theme:a.theme,pre,ac,t0:Date.now(),chars:0,thinking:false};
  job.promise=(async()=>{try{
      const nonce=`\n（第${seen(k).length+1}题，随机码 ${Math.random().toString(36).slice(2,8)}，请出一道和以往完全不同的新题。）`;
      if(!pre)store.set("lgf-pend-"+k,{th,at:Date.now()});
      let r;for(let tries=0;;tries++){job.hid=document.hidden;
        try{r=await askJSON(a.prompt(th,seen(k).join("；"))+nonce,ac.signal,1,{model:genModel(),onProgress:(n,thinking)=>{job.chars=n;job.thinking=thinking}});break}
        catch(e){const cut=e&&(e.code==="network"||((e.code==="invalid_json"||e.code==="empty")&&job.hid));
          if(!cut||tries>=3||(e&&e.name==="AbortError"))throw e;
          job.retry=tries+1;job.chars=0;job.thinking=false;await whenVisible(ac.signal);await new Promise(r=>setTimeout(r,800*(tries+1)));job.t0=Date.now()}}
      if(!a.check(r))throw{code:"bad"};
      const it={...r,th,src:"AI"};addSeen(k,String(r.title||r.t||r.ctx||r.text||r.zh||"").slice(0,40));
      if(job.pre)store.set("lgf-buf-"+k,{th,item:it});else store.set("lgf-cur-"+k,it);
      return it}
    catch(e){if(e&&e.name==="AbortError")return null;
      if(job.pre)return null;
      const it=pickBuiltin(a.pool,k,a.theme,a.filter,true);it.err=errText(e);store.set("lgf-cur-"+k,it);return it}
    finally{if(JOBS[k]===job){delete JOBS[k];if(!job.pre)store.set("lgf-pend-"+k,null)}}})();
  JOBS[k]=job;return job}

  signal&&signal.addEventListener("abort",()=>{document.removeEventListener("visibilitychange",f);rej({name:"AbortError"})})})}

async function nextItem({k,theme,pool,prompt,check,btn,box,filter,accept}){
  const ai=apiReady(),args={theme,pool,prompt,check,filter};

    const it=pickBuiltin(pool,k,theme,filter,!ai);

function speak(text,rate=1){

  if(ttsCfg().mode==="ai")return speakAI(text,rate);
  if(!sysTTS())return toast("这个浏览器不支持朗读。换 Chrome 打开，或到“我的 → 朗读设置”改用 AI 语音。",6000);
  loadVoices();const v=esVoice();
  if(TTS.voices.length&&!v)toast("手机没有西语语音包，可能读不出来。到 系统设置 → 文字转语音 安装西班牙语，或改用 AI 语音。",6000);
  try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang=v?v.lang:"es-ES";if(v)u.voice=v;u.rate=.95*rate;
    let started=false;u.onstart=()=>{started=true};
    u.onerror=e=>{if(!/interrupted|canceled/.test(e.error||""))toast("朗读失败（"+(e.error||"未知")+"）。可以换 Chrome，或改用 AI 语音。",6000)};
    speechSynthesis.speak(u);
    setTimeout(()=>{if(!started&&!speechSynthesis.speaking)toast("没有声音？这个浏览器可能不支持朗读。换 Chrome 打开，或到“我的”改用 AI 语音。",6000)},2500)}
  catch(e){toast("朗读失败。换 Chrome 打开，或改用 AI 语音。")}}
async function speakAI(text,rate){
  const c=ttsCfg(),m=cfg();
  const base=(c.base||m.base||"").trim().replace(/\/+$/,"").replace(/\/chat\/completions$/,"").replace(/\/audio\/speech$/,"");
  const key=(c.key||m.key||"").trim();
  if(!base||!key)return toast("AI 语音还没设置好，到“我的 → 朗读设置”填写。");
  const ck=[text,rate,c.voice,c.model,base].join("|");
  try{let url=audioCache.get(ck);
    if(!url){toast("正在生成语音…",1500);
      const body={model:c.model||"gpt-4o-mini-tts",input:text,voice:c.voice||"nova",speed:rate,response_format:"mp3"};
      if(/gpt-4o/.test(body.model))body.instructions="Habla en español latinoamericano, con acento neutro y claro.";
      const res=await fetch(base+"/audio/speech",{method:"POST",headers:{"Content-Type":"application/json","Authorization":"Bearer "+key},body:JSON.stringify(body)});
      if(!res.ok){let msg="";try{const j=await res.json();msg=j.error?.message||""}catch(_){}throw{code:"http",status:res.status,msg}}
      url=URL.createObjectURL(await res.blob());audioCache.set(ck,url)}
    await new Audio(url).play()}
  catch(e){toast("AI 语音失败："+(e&&typeof e.code==="string"?errText(e):e&&e.name==="NotAllowedError"?"浏览器拦截了播放，再点一次试试":"返回的不是可播放的音频，检查语音模型名和声音名"),6000)}}
function reviewHTML(mod,r,opt={}){
  const names=DIMS[mod],s=r.scores||{};
  const total=Math.max(0,Math.min(100,Math.round(+r.total||Object.keys(names).reduce((a,k)=>a+(+s[k]||0),0)*5)));
  return {total,html:`<div class="card m-${mod}"><h2>${opt.noScore?"参考思路":"点评"}</h2>
   ${opt.noScore?"":`<div class="score-top"><div class="total">${total}<small> / 100</small></div><div class="dims">
   ${Object.keys(names).map(k=>`<div class="dim"><span>${names[k]}</span><span class="bar"><i style="width:${(+s[k]||0)*20}%"></i></span><span>${+s[k]||0}</span></div>`).join("")}</div></div>`}
   ${(r.read_a||r.read_b)?`<div class="read">${r.read_a?`<div><b>${opt.la||"关键"}</b>${esc(r.read_a)}</div>`:""}${r.read_b?`<div><b>${opt.lb||"要点"}</b>${esc(r.read_b)}</div>`:""}</div>`:""}
   ${r.good?`<p class="note">👍 ${esc(r.good)}</p>`:""}${r.improve?`<p class="note bad"><b>可以更好：</b>${esc(r.improve)}</p>`:""}
   ${altsHTML((r.better||[]).filter(b=>b&&b.text).map(b=>[b.label||"参考版本",b.text,b.why||""]),opt.speak)}
   ${opt.offline?`<p class="hint">离线粗略打分。到“我的”接入 API 后，点评会针对你写的内容。</p>`:""}</div>`}}
function refReview(ref){ref=ref||{};return {read_a:ref.a,read_b:ref.b,better:(ref.alts||[]).map(a=>({label:a[0],text:a[1],why:a[2]}))}}
function apiHint(){return !apiReady()?`<span class="pill no">未接入 AI</span> 现在用内置题库，<a href="#me">接入后</a>还能让 AI 点评和出新题`
  :srcPref()==="pool"?`<span class="pill ok">AI 已接入</span> 题库优先：出题不花 API，点评才调用 AI`:`<span class="pill ok">AI 已接入</span> AI 出题：每次都生成新题`}
async function scored({mod,box,btn,prompt,offline,opt,onDone}){
  if(!apiReady()){const r0=offline(),v=reviewHTML(mod,r0,{...opt,offline:true});box.hidden=false;box.innerHTML=v.html;bindMini(box);onDone(v.total);logEvent(mod,{score:v.total,improve:r0.improve||"",offline:true,...(opt.meta||{})});return}
  const c=newCtl();box.hidden=false;box.innerHTML=`<div class="card m-${mod}"><div class="status"><span class="spin"></span>AI 正在点评…</div><button class="btn ghost" id="stop">停止</button></div>`;
  $("#stop").onclick=()=>c.abort();btn.disabled=true;
  try{const r=await askJSON(prompt,c.signal,.4);if(!r.scores)throw{code:"invalid_json"};const v=reviewHTML(mod,r,opt);box.innerHTML=v.html;bindMini(box);onDone(v.total);logEvent(mod,{score:v.total,improve:short(r.improve,80),good:short(r.good,60),...(opt.meta||{})})}
  catch(e){if(e&&e.name==="AbortError"){box.hidden=true;box.innerHTML=""}
    else{box.innerHTML=`<div class="card m-${mod}"><p class="note bad"><b>点评失败：</b>${esc(errText(e))}</p><button class="btn ghost" id="fb">先看离线点评</button></div>`;
      $("#fb").onclick=()=>{const v=reviewHTML(mod,offline(),{...opt,offline:true});box.innerHTML=v.html;bindMini(box)}}}
  finally{btn.disabled=false;if(ctl===c)ctl=null}}

const htmlText=h=>{try{return (new DOMParser().parseFromString(String(h||""),"text/html").body.textContent||"").replace(/\s+/g," ").trim()}catch(e){return String(h||"")}};
async function getText(url,ms=12000){const ac=new AbortController(),tm=setTimeout(()=>ac.abort(),ms);
  try{const r=await fetch(url,{signal:ac.signal});if(!r.ok)throw{code:"http",status:r.status};return await r.text()}finally{clearTimeout(tm)}}
async function rssItems(url){
  try{const j=JSON.parse(await getText("https://api.rss2json.com/v1/api.json?rss_url="+encodeURIComponent(url)));
    if(j.status==="ok"&&j.items&&j.items.length)return j.items.map(x=>({t:htmlText(x.title),d:htmlText(x.content||x.description),link:x.link||x.guid,at:Date.parse(String(x.pubDate||"").replace(" ","T")+"Z")||0}))}catch(e){}
  for(const px of [u=>u,u=>"https://api.allorigins.win/raw?url="+encodeURIComponent(u),u=>"https://corsproxy.io/?url="+encodeURIComponent(u)]){
    try{const x=new DOMParser().parseFromString(await getText(px(url)),"text/xml"),its=[...x.querySelectorAll("item,entry")];
      if(its.length)return its.map(n=>{const g=s=>{const e=n.querySelector(s);return e?e.textContent:""},lk=n.querySelector("link");
        return {t:htmlText(g("title")),d:htmlText(g("description")||g("summary")||g("content")),link:(lk&&(lk.getAttribute("href")||lk.textContent)||g("guid")).trim(),at:Date.parse(g("pubDate")||g("updated")||g("published"))||0}})}catch(e){}}
  throw{code:"news"}}
async function wikiNews(){const now=Date.now();
  for(let i=0;i<3;i++){const x=new Date(now-i*864e5),p=`${x.getUTCFullYear()}/${String(x.getUTCMonth()+1).padStart(2,"0")}/${String(x.getUTCDate()).padStart(2,"0")}`;
    for(const base of ["https://en.wikipedia.org/api/rest_v1/feed/featured/","https://api.wikimedia.org/feed/v1/wikipedia/en/featured/"]){
      try{const j=JSON.parse(await getText(base+p));if(j.news&&j.news.length)return j.news.map(n=>{const t=htmlText(n.story),l=(n.links||[])[0];
        return {t,d:t+"\n"+(n.links||[]).slice(0,3).map(l=>(l.normalizedtitle||l.title||"")+"："+(l.extract||"")).join("\n"),link:l&&l.content_urls?l.content_urls.mobile.page:"https://en.m.wikipedia.org/wiki/Portal:Current_events#"+encodeURIComponent(t.slice(0,30)),at:0}})}catch(e){}}}
  throw{code:"news"}}
const NEWS_LOAD={};
async function newsLoad(src,force){const ck="lgf-news-c-"+src.id,c=store.get(ck,null);
  if(!force&&c&&Date.now()-c.at<30*6e4&&c.items.length)return c;
  if(NEWS_LOAD[src.id])return NEWS_LOAD[src.id];
  return NEWS_LOAD[src.id]=(async()=>{try{
    let items=src.wiki?await wikiNews():await rssItems(src.rss);
    const seen=new Set();items=items.filter(x=>x.t&&x.link&&!seen.has(x.link)&&seen.add(x.link)).map(x=>({...x,d:short(x.d,2000),src:src.desc,lang:src.lang||"es"}))
      .sort((a,b)=>b.at-a.at).slice(0,25);
    const r={at:Date.now(),items};store.set(ck,r);return r}
    catch(e){if(c&&c.items.length)return {...c,stale:true};throw e}finally{delete NEWS_LOAD[src.id]}})()}

K("历史","丝绸之路不只卖丝绸","丝绸之路是连接中国和地中海的一张商路网，兴盛于汉唐。它运的远不只是丝绸：往西有瓷器、茶叶和造纸术，往东有葡萄、胡椒和玻璃，佛教等思想也沿路传播。“丝绸之路”这个名字其实是19世纪德国地理学家李希霍芬起的。它说明，贸易带来的不只是货物，还有技术和观念。造纸术传到西方后，书变得便宜，知识的传播方式也跟着变了。",

K("人文地理","大城市为什么多在水边","翻开地图，大城市大多在河边或海边。原因有三个：取水方便；水运是古代最便宜的运输方式，一条船能运的货顶得上很多辆车；河口和港口又是货物集散的地方，人和生意自然聚过来。上海在长江入海口，伦敦在泰晤士河边，利马紧挨着卡亚俄港。利马几乎不下雨，城市用水主要靠从安第斯山流下来的里马克河。选店面也是同一个道理：看的是人流和货流从哪里经过。",

K("人文地理","安第斯山上的“垂直”生活","安第斯山脉高低落差很大，不同高度的气候完全不同：海岸低地种棉花和水果，中间高度种玉米，3500米以上的高寒地带种土豆和藜麦，放养羊驼。印加人修建梯田，在不同高度种不同的作物，这样一处歉收，别处还能补上。土豆的老家就在这里，秘鲁至今有几千个土豆品种。这种做法的智慧是分散风险，不把所有希望押在一处。",

K("世界文化","送礼的讲究","送礼在不同地方有不同的忌讳。在中国，一般不送钟（和“送终”谐音），也不送伞和梨（“散”“离”）。日本人忌讳数字4和9。在拉美不少地方，送刀具会被理解为想切断关系。有些国家送花，双数是用在葬礼上的。记不住这么多规矩也没关系，把握一个原则就够了：不确定时先问问当地人，或者送吃的和家乡特产，最不容易出错。",

K("世界文化","准时这件事，各地不一样","人类学家爱德华·霍尔把文化分成两类。一类重视日程，一次只做一件事，约好几点就是几点，比如德国、瑞士。另一类更看重人和关系，同时处理几件事很正常，晚到一会儿也不算失礼，拉美、中东和南欧很多地方属于这一类。秘鲁人甚至自嘲有“hora peruana”（秘鲁时间）。这没有对错，只是优先的东西不同。和本地人约事情时留出余量，重要的事可以特别说明要“hora exacta”（准点）。",

K("哲学","斯多葛：分清能管和不能管的","斯多葛学派是古希腊罗马的一种哲学，代表人物有做过奴隶的爱比克泰德和罗马皇帝马可·奥勒留。它的核心想法很简单：有些事由自己决定，比如自己的判断、行动和态度；有些事不由自己决定，比如别人的看法、天气和最后的结果。很多烦恼来自拼命想控制管不了的事。顾客买不买不由你定，货摆得好不好、态度好不好却由你定。心烦的时候可以问自己一句：这件事里，哪一部分是我能做的？",

K("哲学","忒修斯之船","这是古希腊的一个思想实验：一艘船的木板坏一块换一块，最后全部换成了新的，它还是原来那艘船吗？如果有人把换下来的旧木板重新拼成一艘船，哪一艘才是原来的？它问的是，一样东西靠什么保持是它自己：材料、样子，还是一直延续下来的历史。生活里也有类似的问题：一家店换了老板、员工和货品，只剩招牌没变，还是那家店吗？这个问题没有标准答案，但能帮人想清楚，一件事里真正不能丢的是什么。",

K("社会学","邓巴数：朋友的上限","英国人类学家罗宾·邓巴发现，一个人能稳定维持的社交关系大约是150人，这和大脑能处理的信息量有关。再往里分，大约有5个最亲近的人、15个好朋友、50个常来往的朋友。所以通讯录里有几千人，并不等于有几千个关系。它提醒我们：精力有限，要把时间留给最重要的人。一个团队超过150人，光靠大家互相认识就管不过来了，往往需要正式的制度。",

K("社会学","公地悲剧","一片公共草地，每个牧民都想多放一只羊，因为好处归自己，草被多吃一点的代价由大家分摊。可是人人都这么做，草地很快被吃光，所有人都受害。这就是哈丁在1968年提出的“公地悲剧”。生活中的例子很多：过度捕鱼，公共厨房没人打扫，市场的通道被各家的货堆满。解决的办法通常是把规则定清楚，并且互相监督。研究发现，很多社区靠自己商量的规矩，就能把公共资源管好。",

K("文学名著","《百年孤独》","《百年孤独》是哥伦比亚作家加西亚·马尔克斯1967年出版的小说，讲布恩迪亚家族七代人在小镇马孔多的兴衰。它的写法叫魔幻现实主义：把神奇的事写得像家常便饭，比如一场雨连下四年多，一个美人坐着床单升了天。书里的人反复取同样的名字，重复相似的命运，写的是孤独，也是拉丁美洲历史的循环。马尔克斯1982年获得诺贝尔文学奖。读它有助于理解拉美人怎么看自己的过去。",

K("文学名著","《老人与海》","《老人与海》是海明威1952年发表的小说。古巴老渔夫圣地亚哥连续84天没捕到鱼，第85天独自出海，钓到一条比船还大的马林鱼，搏斗了两天两夜才制服它。回程路上鲨鱼一路撕咬，到岸时只剩一副鱼骨架。书里最有名的一句话是：“人可以被毁灭，但不能被打败。”它想说的是，人的尊严不只在于结果，更在于怎么面对失败。海明威1954年获得诺贝尔文学奖。",

K("艺术与审美","留白","中国画讲究“留白”：画面不画满，空着的地方让人自己去想象水、天和雾。齐白石画虾，一笔水都不画，看的人却觉得虾在水里游。这个道理在别处也用得上。货架塞得满满当当会显得廉价，重点商品周围留出空间反而显眼；一张海报上字越多，越没人看。说话也一样，话不说尽，对方才有接话的余地。",

K("艺术与审美","颜色会影响人的感觉","颜色会悄悄影响人的感受。红色醒目，容易让人冲动，所以促销标签和快餐店常用；蓝色显得稳重可靠，银行和科技公司爱用；绿色让人想到自然和健康；黄色最抢眼，但大面积使用容易让人累。不过颜色的含义因文化而异：白色在西方用于婚礼，在中国传统里却和丧事有关。店里可以这样用：促销价签用红黄，想显得专业可信就用蓝色和深色。当然，颜色只是加分，东西好才是根本。",

K("语言与文字","西班牙语是从哪来的","西班牙语来自拉丁语，也就是罗马帝国的语言，和法语、意大利语、葡萄牙语是“亲戚”。8到15世纪，阿拉伯人统治过西班牙的大片地区，留下了很多词，比如 azúcar（糖）、almohada（枕头），还有 ojalá（但愿），它原本的意思是“愿真主保佑”。到了美洲，西语又吸收了当地语言：papa（土豆）和 cancha（场地）来自克丘亚语，chocolate 和 tomate 来自墨西哥的纳瓦特尔语。所以秘鲁的西语里有不少西班牙本土不用的词。",

K("语言与文字","汉字是怎么造出来的","汉字主要有四种造法。象形是照着样子画，比如日、月、山。指事是用符号表示抽象的意思，比如上、下。会意是把两个字的意思合起来，比如“休”是人靠着树，“明”是日和月。形声最多，占了八成左右：一半表示意思，一半表示读音，比如“河”字，三点水表示和水有关，“可”提示读音。懂了形声的规律，遇到生字也能猜个大概。从甲骨文算起，汉字已经用了三千多年。",

K("科学","天空为什么是蓝的","阳光看起来是白的，其实包含了各种颜色的光。光穿过大气时会被空气分子散射到四面八方，其中蓝光的波长短，被散射得最厉害，所以我们抬头看到的天是蓝色的。这种现象叫瑞利散射。到了日出和日落，阳光要斜着穿过更厚的大气，蓝光在路上被散射掉了，剩下的主要是红光和橙光，于是太阳和天边就变红了。",

 ["夕阳发红是因为？","阳光穿过更厚的大气，蓝光被散射掉了","太阳变冷了","云是红色的","剩下的主要是红光和橙光。"],

K("科学","利马为什么总是阴天却不下雨","利马在热带，却不热，几乎不下雨，冬天还总是灰蒙蒙的。原因在海里：沿岸有一股从南极方向流过来的寒流，叫洪堡寒流。它让海面上的空气变冷，形成低低的云和毛毛雨（garúa），但冷空气很稳定，升不上去，下不成大雨。东边高大的安第斯山又挡住了亚马逊的湿气。这股寒流还带来丰富的养分，所以秘鲁的渔业很发达。遇到厄尔尼诺年，海水变暖，秘鲁北部反而会下暴雨。",

K("科技","AI是怎么“说话”的","现在的聊天AI，核心做的是一件事：根据前面的文字，猜下一个最合适的字或词，一个接一个往下写。它读过海量的文字，从中学到了语言的规律和很多知识。但它并不是在查资料库，所以有时会很自信地说出错的内容，这叫“幻觉”。用它的时候，可以把它当成一个聪明但会出错的助手：重要的事实自己再核实一遍；你给的背景越具体，它答得越好。",

K("科技","扫码付款时发生了什么","用手机扫码付钱，钱并没有“飞”过去。二维码里存的只是一串信息，说明收款的人是谁。手机扫码后，支付应用向银行或支付公司的服务器发出请求，服务器把你账户上的数字减掉，在对方账户上加上，几秒钟就完成了。真正变化的只是服务器里的数字。知道了这一点，就明白该注意什么：付款前看清收款人的名字，不扫来历不明的码，有人说“转错了让你退回去”时要多一分警惕。",

K("健康常识","久坐的代价","长时间坐着不动，腿上的血流会变慢，身体消耗的能量也减少。研究发现，久坐和心血管病、糖尿病的风险增加有关。好消息是，办法很简单：每坐半小时到一小时，站起来走动两三分钟，就有帮助。看店的人可以站着接待顾客，把整理货架当成活动，打电话的时候来回走一走。",

K("健康常识","睡觉是在帮你记东西","睡觉不是白白浪费时间。人睡着以后，大脑会整理白天接收的信息，把值得留下的转成长期记忆。所以熬夜背东西效果很差，睡前学一会儿、睡一觉再复习，反而记得牢。成年人一般需要七到九小时的睡眠。还有一点常被忽略：咖啡因在身体里要五六个小时才代谢掉一半，下午三四点喝的咖啡，到了半夜还在起作用。",

K("理财常识","通货膨胀：钱为什么越来越不值钱","通货膨胀就是东西普遍涨价，同样的钱能买到的东西变少。如果每年涨3%，大约24年后，价格就会翻一倍。有个简单的算法叫“72法则”：用72除以每年的涨幅，就是翻倍需要的年数。所以现金一直放着不动，其实是在慢慢缩水。对做生意的人来说，进货成本会跟着涨，售价也要定期检查，不能几年不变。",

/* activity log: what the tutor reads */
function logEvent(m,data){try{const L=store.get("lgf-log",[]);L.push({d:dkey(),m,...data});store.set("lgf-log",L.slice(-400))}catch(e){}}
const short=(s,n=40)=>{s=String(s||"").replace(/\s+/g," ").trim();return s.length>n?s.slice(0,n)+"…":s};
const daysAgo=k=>k?dayNum()-dayNum(new Date(k+"T12:00:00")):null;
const MNAME={eq:"接话",es:"西语",think:"决策",logic:"逻辑",ana:"分析",know:"知识"};
function buildProfile(){
  const s=S(),L=store.get("lgf-log",[]),out=[];
  const act=[];for(let i=0;i<14;i++){const d=new Date();d.setDate(d.getDate()-i);act.push(Object.keys(s.days[dkey(d)]||{}).length)}
  out.push(`连练 ${streak()} 天；近14天有 ${act.filter(Boolean).length} 天练习；今天完成 ${Object.keys(today()).length}/5 项。西语等级 ${getLv()}，已学表达卡 ${Object.keys(s.cards).length} 张，待复习 ${dueCards().length} 张。`);
  const avg=a=>a.length?Math.round(a.reduce((x,y)=>x+y,0)/a.length):null;
  for(const m of ["eq","es","think","logic","ana","know"]){
    const ev=L.filter(e=>e.m===m),wk=ev.filter(e=>daysAgo(e.d)<7&&typeof e.score==="number"),pw=ev.filter(e=>daysAgo(e.d)>=7&&daysAgo(e.d)<14&&typeof e.score==="number");
    const last=ev.length?ev[ev.length-1].d:null,a1=avg(wk.map(e=>e.score)),a0=avg(pw.map(e=>e.score)),all=avg(s.scores[m]||[]);
    out.push(`【${MNAME[m]}】共${(s.scores[m]||[]).length}次，总平均${all??"–"}；近7天${wk.length}次${a1!=null?"平均"+a1:""}${a0!=null?"（上周"+a0+"）":""}；${last?"最近一次在"+daysAgo(last)+"天前":"还没练过"}。`);
    const fmt=e=>`${e.th?e.th+"：":""}${short(e.improve,45)}${typeof e.score==="number"?"("+e.score+")":""}`;
    const imp=ev.filter(e=>e.improve&&!e.offline).slice(-6).map(fmt),offi=ev.filter(e=>e.improve&&e.offline).slice(-3).map(fmt);
    if(imp.length)out.push(`  AI点评指出的问题：${imp.join("；")}`);
    if(offi.length)out.push(`  离线规则提示（较粗略）：${offi.join("；")}`);
    if(m==="es"){const cz=ev.filter(e=>e.kind==="cloze"),bad=cz.filter(e=>!e.ok).slice(-10).map(e=>e.item),forg=ev.filter(e=>e.kind==="card"&&!e.ok).slice(-8).map(e=>e.item);
      if(cz.length)out.push(`  填空：近期${cz.slice(-30).length}题对${cz.slice(-30).filter(e=>e.ok).length}题；答错的：${bad.join(", ")||"无"}`);
      if(forg.length)out.push(`  翻卡标“不会”的：${forg.join(", ")}`);
      const dw=Object.values(store.get("lgf-wd",{})).filter(e=>e&&e.d).sort((a,b)=>(b.last||0)-(a.last||0)).slice(0,10).map(e=>e.d.es);if(dw.length)out.push(`  用“深入学”查过的词：${dw.join(", ")}`);
      const t=ev.filter(e=>e.kind==="test").pop();if(t)out.push(`  水平测试结果 ${t.rec}（${daysAgo(t.d)}天前）`)}
    if(m==="logic"){const bad=ev.filter(e=>!e.ok).slice(-5).map(e=>short(e.why,30));if(ev.length)out.push(`  正确率 ${Math.round(ev.filter(e=>e.ok).length/ev.length*100)}%；错题涉及：${bad.join("；")||"无"}`)}
    if(m==="know"){const t=ev.slice(-6).map(e=>e.title+(e.score<100?"(错"+(e.wrong||[]).length+"题)":""));if(t.length)out.push(`  最近读过：${t.join("、")}`);
      const kb=kbAll(),st=kb.filter(x=>x.star),nt=kb.filter(x=>x.note).slice(-4);
      if(kb.length)out.push(`  知识库 ${kb.length} 篇，常读板块：${Object.entries(kb.reduce((o,x)=>(o[x.field]=(o[x.field]||0)+1,o),{})).sort((a,b)=>b[1]-a[1]).slice(0,4).map(x=>x[0]+x[1]).join("、")}`);
      if(st.length)out.push(`  收藏（感兴趣）：${st.slice(-8).map(x=>x.title).join("、")}`);
      if(nt.length)out.push(`  他写的心得：${nt.map(x=>x.title+"——"+short(x.note,30)).join("；")}`);
      const rv=ev.filter(x=>x.kind==="review");if(rv.length)out.push(`  收藏回顾：${rv.length}次，记住${rv.filter(x=>x.ok).length}次`)}
    if(m==="ana"){const d=ev.filter(e=>e.kind==="det"),sp=ev.filter(e=>e.kind==="split"),es2=ev.filter(e=>e.kind==="est");
      if(d.length)out.push(`  侦探案例${d.length}次，平均提问${Math.round(d.filter(e=>e.asked!=null).reduce((x,e)=>x+e.asked,0)/Math.max(1,d.filter(e=>e.asked!=null).length))}个，直接看答案${d.filter(e=>e.gaveup).length}次`);
      if(sp.length||es2.length)out.push(`  拆解题${sp.length}次，估算题${es2.length}次`)}
    if(m==="eq"){const tr=ev.filter(e=>e.kind==="trap");if(tr.length)out.push(`  踩坑识别：${tr.length}题对${tr.filter(e=>e.ok).length}题`)}
  }
  return out.join("\n")}

/* rule-based tip when AI is off or fails */
function ruleTip(){
  const L=store.get("lgf-log",[]),t=today();
  if(L.length<3)return "刚开始记录，先把今天的几项练一遍，我会慢慢摸清你的强项和弱项。";
  const last={};L.forEach(e=>{last[e.m==="logic"?"think":e.m]=e.d});
  const stale=["eq","es","think","know"].map(m=>[m,last[m]?daysAgo(last[m]):99]).sort((a,b)=>b[1]-a[1])[0];
  if(stale[1]>=3)return `${MOD[stale[0]].full}已经 ${stale[1]>=99?"还没开始":stale[1]+" 天没练了"}，今天先从它开始吧。`;
  const cz=L.filter(e=>e.kind==="cloze").slice(-20);
  if(cz.length>=5&&cz.filter(e=>e.ok).length/cz.length<.6)return "最近表达卡填空正确率不到六成，今天把表达卡筛到“搭配”，多复习几张。";
  if(dueCards().length>=10)return `有 ${dueCards().length} 张表达卡到期了，先清掉复习，记忆最牢。`;
  if(Object.keys(t).length>=5)return "今天的训练都完成了，状态不错。可以去导师页聊聊这周的收获。";
  return "保持节奏就好。今天挑一个你最不想练的模块先做，往往收获最大。"}

  if(cached&&cached.d===dkey()&&cached.s===style)return show(cached.text,"AI 导师 · "+TUTOR_STYLE[style].n);
  if(!apiReady()||logCount()<3)return show(ruleTip(),apiReady()?"记录还少，先按规则提醒":"离线提醒 · 接入 AI 后会更有针对性");
  show(ruleTip(),"正在根据你的记录生成今天的建议…");

  catch(e){show(ruleTip(),"AI 暂时没连上，先用规则提醒")}}

/* ================= ROUTER ================= */
/* ================= 成长：修炼线、等级、成就、反馈 ================= */
const TRACKS={eq:{n:"接话",g:"话",m:"eq"},es:{n:"西语",g:"西",m:"es"},think:{n:"思维",g:"思",m:"think"},know:{n:"知识",g:"知",m:"know"}};
const TRACK_OF={eq:"eq",es:"es",think:"think",logic:"think",ana:"think",know:"know"};
const LEVELS=[[0,"初学"],[100,"入门"],[300,"熟练"],[700,"精进"],[1500,"精通"],[3000,"大师"]];
function lvOf(xp){let i=0;while(i<LEVELS.length-1&&xp>=LEVELS[i+1][0])i++;
  const cur=LEVELS[i][0],nxt=LEVELS[i+1]?LEVELS[i+1][0]:null;return {i,name:LEVELS[i][1],cur,nxt,pct:nxt?Math.round((xp-cur)/(nxt-cur)*100):100}}
function xpAll(){let x=store.get("lgf-xp",null);
  if(!x){const s=S(),kb=store.get("lgf-kb",[]);x={eq:0,es:0,think:0,know:0};
    for(const m in s.scores)(s.scores[m]||[]).forEach(v=>{const t=TRACK_OF[m];if(t)x[t]+=10+Math.round((+v||0)/10)});
    x.es+=Object.keys(s.cards||{}).length*3;x.know+=kb.length*5;store.set("lgf-xp",x)}
  return x}
const xpTotal=()=>Object.values(xpAll()).reduce((a,b)=>a+b,0);
function gainXP(t,amt){if(!TRACKS[t]||!amt)return;const x=xpAll(),before=lvOf(x[t]);x[t]+=amt;store.set("lgf-xp",x);const after=lvOf(x[t]);
  if(after.i>before.i)celebrate({mod:TRACKS[t].m,glyph:TRACKS[t].g,k:"境界提升",title:`${TRACKS[t].n} · ${after.name}`,text:after.nxt?`再积累 ${after.nxt-x[t]} 修炼值，进入「${LEVELS[after.i+1][1]}」`:"已到达最高境界"});
  setTimeout(()=>checkAch(false),50)}
/* hook the existing scoring calls instead of touching every module */
const __addScore=addScore;addScore=function(m,v){__addScore(m,v);gainXP(TRACK_OF[m],10+Math.round((+v||0)/10))};
const __rateCard=rateCard;rateCard=function(w,r){__rateCard(w,r);gainXP("es",r===0?1:3)};
const __logEvent=logEvent;logEvent=function(m,d){__logEvent(m,d);if(d&&d.kind==="review")gainXP("know",d.ok?5:2);if(m==="tutor")setTimeout(()=>checkAch(false),50)};

const ACH=[
 ["first","初次修炼","完成第一次练习","始","eq",c=>c.xp>0],
 ["s3","三日不辍","连续练习 3 天","三","eq",c=>c.streak>=3],
 ["s7","七日之约","连续练习 7 天","七","eq",c=>c.streak>=7],
 ["s30","月度坚持","连续练习 30 天","月","eq",c=>c.streak>=30],
 ["day","圆满一天","一天完成全部 5 项功课","满","eq",c=>Object.values(c.s.days).some(d=>Object.keys(d).length>=5)],
 ["full","满分时刻","任意练习拿到 100 分","百","eq",c=>["eq","es","think","ana","know"].some(m=>(c.s.scores[m]||[]).includes(100))],
 ["w50","词汇小成","学会 50 张表达卡","词","es",c=>Object.keys(c.s.cards).length>=50],
 ["w150","词汇大成","学会 150 张表达卡","汇","es",c=>Object.keys(c.s.cards).length>=150],
 ["test","知己知彼","完成一次西语水平测试","测","es",c=>c.log.some(e=>e.kind==="test")],
 ["logic","火眼金睛","逻辑题累计答对 10 道","眼","think",c=>c.log.filter(e=>e.m==="logic"&&e.ok).length>=10],
 ["det","名侦探","侦探案例拿到 80 分以上","探","think",c=>c.log.some(e=>e.m==="ana"&&e.kind==="det"&&e.score>=80)],
 ["star","知识收藏家","收藏 10 篇知识卡","藏","know",c=>c.kb.filter(k=>k.star).length>=10],
 ["note","有所思","写下 5 条知识心得","思","know",c=>c.kb.filter(k=>k.note).length>=5],
 ["tutor","复盘者","生成第一份周复盘","复","eq",c=>c.log.some(e=>e.m==="tutor")],
 ["round","全面发展","四条修炼线都达到「熟练」","全","think",c=>Object.values(c.x).every(v=>v>=300)],
 ["master","一门精通","任一修炼线达到「精通」","精","know",c=>Object.values(c.x).some(v=>v>=1500)]];
function achCtx(){const x=xpAll();return {s:S(),x,xp:Object.values(x).reduce((a,b)=>a+b,0),log:store.get("lgf-log",[]),kb:store.get("lgf-kb",[]),streak:streak()}}
function checkAch(silent){const got=store.get("lgf-ach",{}),c=achCtx(),fresh=[];
  for(const [id,n,d,g,m,test] of ACH){if(!got[id]){let ok=false;try{ok=test(c)}catch(e){}if(ok){got[id]=dkey();fresh.push({id,n,d,g,m})}}}
  if(fresh.length){store.set("lgf-ach",got);if(!silent)fresh.forEach(a=>celebrate({mod:a.m,glyph:a.g,k:"解锁成就",title:a.n,text:a.d}))}}

/* celebration card, queued */
const celeQ=[];let celeOn=false;
function buzz(p){try{navigator.vibrate&&navigator.vibrate(p)}catch(e){}}
function celebrate(o){celeQ.push(o);if(!celeOn)nextCele()}
function nextCele(){const o=celeQ.shift();if(!o){celeOn=false;return}celeOn=true;buzz([18,60,28]);
  const el=document.createElement("div");el.className="cele m-"+(o.mod||"eq");el.setAttribute("role","dialog");
  const sp=Array.from({length:10},(_,i)=>{const a=i/10*Math.PI*2,r=70+Math.random()*30;return `<i class="spark" style="--x:${Math.cos(a)*r}px;--y:${Math.sin(a)*r}px;animation-delay:${.1+Math.random()*.2}s"></i>`}).join("");
  el.innerHTML=`<div class="box"><div class="badge">${esc(o.glyph||"✓")}${sp}</div><div class="k">${esc(o.k||"")}</div><h3>${esc(o.title)}</h3><p>${esc(o.text||"")}</p><p class="hint" style="margin-top:14px">轻点任意处继续</p></div>`;
  document.body.appendChild(el);
  let done=false;const close=()=>{if(done)return;done=true;el.classList.add("out");setTimeout(()=>{el.remove();nextCele()},320)};
  el.onclick=close;setTimeout(close,3200)}

/* small feedback everywhere: answer buzz, score count-up */
document.addEventListener("click",e=>{const o=e.target.closest&&e.target.closest(".opt");if(!o)return;
  setTimeout(()=>{if(o.classList.contains("good"))buzz(14);else if(o.classList.contains("bad"))buzz([26,40,26])},0)});
function countUp(el){const node=el.firstChild;if(!node||node.nodeType!==3)return;const target=parseInt(node.nodeValue,10);if(!(target>0)||el.dataset.cu)return;el.dataset.cu=1;
  if(matchMedia("(prefers-reduced-motion: reduce)").matches)return;
  const t0=performance.now(),dur=900;const step=t=>{const p=Math.min(1,(t-t0)/dur),e=1-Math.pow(1-p,3);node.nodeValue=String(Math.round(target*e));if(p<1)requestAnimationFrame(step)};
  node.nodeValue="0";requestAnimationFrame(step);if(target>=80)setTimeout(()=>buzz(12),dur)}
new MutationObserver(ms=>{for(const m of ms)for(const n of m.addedNodes){if(n.nodeType!==1)continue;
  (n.matches&&n.matches(".total")?[n]:[]).concat([...(n.querySelectorAll?n.querySelectorAll(".total"):[])]).forEach(countUp)}}).observe(document.getElementById("app"),{childList:true,subtree:true});

/* ---- dashboard pieces ---- */
function ringHTML(n,total){const r=50,c=2*Math.PI*r,off=c*(1-n/total);
  return `<div class="ring"><svg viewBox="0 0 120 120" aria-hidden="true"><defs><linearGradient id="rg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" style="stop-color:var(--eq)"/><stop offset="1" style="stop-color:var(--think)"/></linearGradient></defs>
   <circle class="trk" cx="60" cy="60" r="${r}"/><circle class="val" cx="60" cy="60" r="${r}" stroke-dasharray="${c.toFixed(1)}" stroke-dashoffset="${c.toFixed(1)}" data-off="${off.toFixed(1)}"/></svg>
   <div class="mid"><b>${n}<small style="font-size:16px;color:var(--muted)">/${total}</small></b><span>今日功课</span></div></div>`}
function radarHTML(){const s=S(),ax=[["eq","接话"],["es","西语"],["think","决策"],["logic","逻辑"],["ana","分析"],["know","知识"]];
  const vals=ax.map(([m])=>{const a=(s.scores[m]||[]).slice(-10);return a.length?a.reduce((x,y)=>x+y,0)/a.length:0});
  const cx=110,cy=100,R=62,pt=(i,v)=>{const a=-Math.PI/2+i*Math.PI*2/ax.length;return [cx+Math.cos(a)*R*v,cy+Math.sin(a)*R*v]};
  const grid=[.25,.5,.75,1].map(l=>`<polygon points="${ax.map((_,i)=>pt(i,l).map(n=>n.toFixed(1)).join(",")).join(" ")}" style="fill:none;stroke:var(--line)"/>`).join("");
  const spokes=ax.map((_,i)=>{const [x,y]=pt(i,1);return `<line x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" style="stroke:var(--line)"/>`}).join("");
  const shape=vals.map((v,i)=>pt(i,Math.max(.04,v/100)).map(n=>n.toFixed(1)).join(",")).join(" ");
  const labs=ax.map(([m,n],i)=>{const [x,y]=pt(i,1.28);return `<text x="${x.toFixed(1)}" y="${(y+4).toFixed(1)}" text-anchor="middle">${n}<tspan style="fill:var(--ink)" font-weight="700" dx="3">${vals[i]?Math.round(vals[i]):"–"}</tspan></text>`}).join("");
  const has=vals.some(v=>v>0);
  return `<svg class="radar" viewBox="0 0 220 200" role="img" aria-label="能力雷达">${grid}${spokes}
   <polygon points="${shape}" style="fill:color-mix(in srgb,var(--think) 22%,transparent);stroke:var(--think);stroke-width:2;stroke-linejoin:round;opacity:${has?1:.35}"/>
   ${vals.map((v,i)=>{const [x,y]=pt(i,Math.max(.04,v/100));return v?`<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="3" style="fill:var(--think)"/>`:""}).join("")}${labs}</svg>
   <p class="hint" style="text-align:center">${has?"最近 10 次的平均分":"做几次练习后，这里会长出你的能力图"}</p>`}
function tracksHTML(){const x=xpAll();
  return `<div class="tracks">${Object.entries(TRACKS).map(([k,t])=>{const l=lvOf(x[k]);
    return `<div class="trk-row m-${t.m}"><span class="g">${t.g}</span><div><div class="top"><b>${t.n} <span class="lvlpill">${l.name}</span></b><span>${l.nxt?`${x[k]} / ${l.nxt}`:`${x[k]} · 满级`}</span></div><div class="bar"><i style="width:${l.pct}%"></i></div></div></div>`}).join("")}</div>`}
function achWallHTML(){const got=store.get("lgf-ach",{}),n=Object.keys(got).length;
  return `<div class="row" style="justify-content:space-between;align-items:baseline"><h2>成就墙</h2><span class="lbl">${n} / ${ACH.length}</span></div>
   <div class="achs">${ACH.map(([id,nm,d,g,m])=>`<div class="ach m-${m} ${got[id]?"":"lock"}" title="${esc(d)}"><span class="b">${got[id]?esc(g):"?"}</span><span class="n">${esc(nm)}</span><span class="d">${got[id]?esc(got[id].slice(5).replace("-","月"))+"日":esc(d)}</span></div>`).join("")}</div>`}
function greet(){const h=new Date().getHours();return h<5?"夜深了":h<11?"早上好":h<13?"中午好":h<18?"下午好":"晚上好"}

function mergeKeyed(L,R,base,pick){const out=new Map(),b=new Set(base||[]);
  for(const [id,r] of R)if(L.has(id)||!b.has(id))out.set(id,L.has(id)?pick(L.get(id),r):r);
  for(const [id,l] of L)if(!R.has(id)&&!b.has(id))out.set(id,l);
  return out}
const arrMap=(a,idf)=>new Map((Array.isArray(a)?a:[]).filter(Boolean).map(x=>[idf(x),x]));
const objMap=o=>new Map(Object.entries(o&&typeof o==="object"?o:{}));
const MERGE={
  "lgf":(l,r,b,lNew)=>{const A=J(l,{}),B=J(r,{}),o=lNew?{...B,...A}:{...A,...B};
    o.days={...(B.days||{})};for(const d in (A.days||{})){const x=o.days[d]||{},y=A.days[d]||{};o.days[d]={...x,...y};for(const f in x)if(typeof x[f]==="number"&&typeof y[f]==="number")o.days[d][f]=Math.max(x[f],y[f])}
    o.scores={};const sa=A.scores||{},sb=B.scores||{};for(const m of new Set([...Object.keys(sa),...Object.keys(sb)])){const x=sa[m]||[],y=sb[m]||[];o.scores[m]=x.length>y.length?x:y.length>x.length?y:(lNew?x:y)}
    const cards=mergeKeyed(objMap(A.cards),objMap(B.cards),b,(x,y)=>x.easy?x:y.easy?y:(x.due||0)>=(y.due||0)?x:y);o.cards=Object.fromEntries(cards);
    return {v:JSON.stringify(o),ids:[...cards.keys()]}},
  "lgf-xp":(l,r)=>{const A=J(l,{}),B=J(r,{}),o={...B};for(const k in A)o[k]=Math.max(A[k]||0,B[k]||0);return {v:JSON.stringify(o)}},
  "lgf-ach":(l,r)=>({v:JSON.stringify({...J(l,{}),...J(r,{})})}),
  "lgf-log":(l,r)=>{const seen=new Set(),o=[];for(const e of [...J(r,[]),...J(l,[])]){const s=JSON.stringify(e);if(!seen.has(s)){seen.add(s);o.push(e)}}
    o.sort((a,b)=>String(a.d).localeCompare(String(b.d)));return {v:JSON.stringify(o.slice(-400))}}};
const keyedArr=idf=>(l,r,b,lNew)=>{const m=mergeKeyed(arrMap(J(l,[]),idf),arrMap(J(r,[]),idf),b,(x,y)=>lNew?x:y);return {v:JSON.stringify([...m.values()]),ids:[...m.keys()]}};
const keyedObj=pick=>(l,r,b,lNew)=>{const m=mergeKeyed(objMap(J(l,{})),objMap(J(r,{})),b,pick||((x,y)=>lNew?x:y));return {v:JSON.stringify(Object.fromEntries(m)),ids:[...m.keys()]}};
MERGE["lgf-kb"]=keyedArr(x=>String(x.id));MERGE["lgf-words"]=keyedArr(x=>String(x.es));MERGE["lgf-news-custom"]=keyedArr(x=>String(x.id));
MERGE["lgf-wd"]=keyedObj((x,y)=>(x.last||0)>=(y.last||0)?x:y);MERGE["lgf-news-read"]=keyedObj();
const mergeFn=k=>MERGE[k]||(k.startsWith("lgf-done-")?keyedArr(x=>String(x)):null);
const idsOf=(k,v)=>{const f=mergeFn(k);if(!f)return undefined;try{return f(v,v,null,true).ids}catch(e){return undefined}};

let SYNCING=null,syncAgain=false,syncMsg="";
function syncNow(why){if(!syncOn())return Promise.resolve(false);if(SYNCING){syncAgain=true;return SYNCING}
  clearTimeout(dirtyT);dirtyAt=0;
  SYNCING=(async()=>{const c=syncCfg(),st=store.get("lgf-sync-st",{}),now=Date.now();let changed=[];
    try{
      let id=c.gist||await gistFind();
      const remote=id?await gistRead(id):null,RK=(remote&&remote.keys)||{};
      let key=null;try{if(crypto&&crypto.subtle)key=await syncKey(c.token)}catch(e){}
      /* decode remote */
      const R={};for(const k in RK){const e=RK[k];if(!syncable(k))continue;
        if(e.del){R[k]={t:e.t,del:1};continue}
        if(typeof e.v==="string"&&e.v.startsWith("enc:")){if(!key)continue;try{R[k]={t:e.t,v:await decS(key,e.v)}}catch(_){R[k]={t:0,bad:1}}}else R[k]={t:e.t,v:e.v}}
      /* local snapshot */
      const L={};for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(syncable(k)){const v=localStorage.getItem(k),h=hashS(v);
        L[k]={v,t:st[k]&&st[k].h===h?(st[k].t||0):Math.max(META[k]||0,st[k]?now:(META[k]||now))}}}
      const out={},nst={};let push=!remote;
      const putLocal=(k,v,t)=>{if(localStorage.getItem(k)!==v){localStorage.setItem(k,v);changed.push(k)}META[k]=t};
      for(const k of new Set([...Object.keys(L),...Object.keys(R),...Object.keys(st)])){if(!syncable(k))continue;
        const l=L[k],r=R[k],b=st[k];
        if(r&&r.bad){if(l){out[k]={t:now,v:l.v};push=true}else continue}
        else if(l&&r&&!r.del){
          if(l.v===r.v)out[k]={t:Math.max(l.t,r.t),v:l.v};
          else{const f=mergeFn(k),lNew=l.t>r.t;let m=null;if(f){try{m=f(l.v,r.v,b&&b.ids,lNew)}catch(e){m=null}}
            const v=m?m.v:(lNew?l.v:r.v);out[k]={t:v===r.v?r.t:v===l.v?l.t:now,v};if(v!==r.v)push=true;if(v!==l.v)putLocal(k,v,out[k].t)}}
        else if(l&&(!r||r.del)){
          if(r&&r.del&&b&&b.h===hashS(l.v)&&r.t>=(b.t||0)){localStorage.removeItem(k);delete META[k];changed.push(k);out[k]={t:r.t,del:1}}
          else{out[k]={t:l.t||now,v:l.v};push=true}}
        else if(!l&&r&&!r.del){
          if(b&&!b.del){out[k]={t:now,del:1};push=true}          /* deleted on this device since last sync */
          else{putLocal(k,r.v,r.t);out[k]={t:r.t,v:r.v}}}
        else if(!l&&r&&r.del)out[k]={t:r.t,del:1};
        else if(!l&&!r&&b&&!b.del){out[k]={t:now,del:1};push=true}
        if(out[k])nst[k]=out[k].del?{del:1,t:out[k].t}:{h:hashS(out[k].v),t:out[k].t,ids:idsOf(k,out[k].v)}}
      if(push){const keys={};for(const k in out){const e=out[k];
          if(e.del){if(now-e.t<90*864e5)keys[k]={t:e.t,del:1}}
          else if(SYNC_ENC.test(k)){if(key)keys[k]={t:e.t,v:await encS(key,e.v)};else if(RK[k])keys[k]=RK[k]}
          else keys[k]={t:e.t,v:e.v}}
        for(const k in RK)if(!keys[k]&&!out[k]&&!(k in R&&R[k].bad))keys[k]=RK[k];   /* keep what this device doesn't sync */
        id=await gistWrite(id,{v:1,at:now,dev:c.dev||"",keys})}
      store.set("lgf-sync-st",nst);metaSave();
      _storeSet("lgf-sync",{...syncCfg(),gist:id,last:now,err:""});syncMsg="";
      if(changed.length)syncApplied(changed);
      return true}
    catch(e){syncMsg=syncErr(e);const cc=syncCfg();if(e&&e.sync==="gone")delete cc.gist;_storeSet("lgf-sync",{...cc,err:syncMsg});
      if(why==="manual"||why==="setup")throw e;return false}
    finally{SYNCING=null;syncPaint();if(syncAgain){syncAgain=false;setTimeout(()=>syncNow("auto"),1500)}}})();
  syncPaint();return SYNCING}
function syncApplied(keys){if(keys.includes("lgf")||keys.includes("lgf-words"))deck=null;
  if(keys.includes("lgf-theme"))try{applyTheme()}catch(e){}
  const a=document.activeElement,typing=a&&/^(INPUT|TEXTAREA)$/.test(a.tagName),v=(location.hash.slice(1)||"home").split("/")[0];
  if(!typing&&(v==="home"||v==="me"||(v==="es"&&sub.es==="words")||(v==="know"&&sub.know==="lib")))route();
  toast("已从云端同步了其他设备上的记录 ☁",3500)}
function syncPaint(){const el=document.getElementById("syncst");if(el)el.innerHTML=syncStatusHTML()}
function syncStatusHTML(){const c=syncCfg();if(!c.token)return "还没开启。开启后，手机、平板、电脑上的练功房会自动保持一致，换手机也不丢。";
  if(SYNCING)return `<span class="spin"></span> 正在同步…`;
  if(c.err)return `<b style="color:var(--warn)">⚠ ${esc(c.err)}</b>${c.last?`<br>上次成功：${ago(c.last)}`:""}`;
  return `<b style="color:var(--eq)">✓ 已开启</b> · 上次同步：${c.last?ago(c.last):"还没有"}`}
function syncCardHTML(){const c=syncCfg(),on=!!c.token;
  return `<div class="card" id="synccard"><h2>☁ 云同步</h2><p class="hint" id="syncst">${syncStatusHTML()}</p>
    ${on?`<div class="row"><button class="btn" id="syncgo" style="flex:1">立即同步</button><button class="btn ghost" id="syncoff" style="flex:1">关闭同步</button></div>
      <p class="hint">数据存在你自己 GitHub 账号的私密文件里。别的设备只要打开练功房，在这里填同一个口令就能同步。平时不用管它：打开时、练完后、切回来时都会自动同步。</p>`
     :`<div class="field"><label class="lbl" for="synctk">GitHub 同步口令（token）</label><input id="synctk" type="password" placeholder="ghp_… 或 github_pat_…" autocomplete="off" autocapitalize="off" spellcheck="false"></div>
      <label class="ckl"><input type="checkbox" id="syncapi" checked> 同时同步 AI 接口设置（加密保存，只有填了同一个口令的设备能读）</label>
      <button class="btn" id="syncon">开启同步</button>
      <details class="hint" style="margin-top:8px"><summary>口令怎么拿？（只需做一次）</summary>
        <ol class="steps"><li>登录 GitHub 后，打开 <a href="https://github.com/settings/tokens/new?scopes=gist&description=%E7%BB%83%E5%8A%9F%E6%88%BF%E5%90%8C%E6%AD%A5" target="_blank" rel="noopener">创建口令页面</a>。</li>
        <li>Expiration（有效期）选 <b>No expiration</b>；下面的权限只勾 <b>gist</b> 一项。</li>
        <li>拉到最下面点 <b>Generate token</b>，复制出现的那串 <b>ghp_</b> 开头的字符。</li>
        <li>回到这里粘贴，点“开启同步”。这串口令请存进备忘录，别的设备还要用。</li></ol>
        <p>这个口令只能读写你账号里的 Gist（小文件），碰不到你的其他东西。</p></details>`}</div>`}
function installCardHTML(){
  return `<div class="card"><h2>📱 安装到桌面</h2>${IS_APP?`<p class="hint"><b style="color:var(--eq)">✓ 已作为 App 运行</b>，没有网络也能打开练习（AI 出题和新闻需要联网）。</p>`
    :!IS_WEB?`<p class="hint">你现在打开的是手机里的文件版，装不了桌面，也不能离线更新。把练功房放到你自己的网址上（GitHub Pages）以后，用那个网址打开，这里就会出现“安装”按钮。</p>`
    :INSTALL_EVT?`<p class="hint">装到桌面后像普通 App 一样点图标就开，全屏、没有网络也能练。</p><button class="btn" id="instgo">安装到桌面</button>`
    :`<p class="hint">点浏览器右上角的 <b>⋮</b> 菜单，选“<b>添加到主屏幕</b>”或“<b>安装应用</b>”。装好后像普通 App 一样点图标就开，没有网络也能练。</p>`}
    <p class="hint">版本 ${APP_VER}${IS_WEB?" · 联网时自动更新到最新版":""}</p></div>`}
function bindAppCards(){
  const ig=$("#instgo");if(ig)ig.onclick=async()=>{const e=INSTALL_EVT;if(!e)return;INSTALL_EVT=null;try{e.prompt();await e.userChoice}catch(_){}VIEWS.me()};
  const on=$("#syncon");if(on)on.onclick=async()=>{const tk=$("#synctk").value.trim();if(!/^(ghp_|github_pat_|gho_)\w{20,}/.test(tk)){$("#syncst").innerHTML=`<b style="color:var(--warn)">这不像 GitHub 口令：应该是 ghp_ 或 github_pat_ 开头的一长串字符。</b>`;return}
    const prev=syncCfg();_storeSet("lgf-sync",{token:tk,api:$("#syncapi").checked,dev:(navigator.userAgent.match(/Android|iPhone|iPad|Windows|Mac/)||["设备"])[0]});on.disabled=true;on.textContent="正在连接…";
    try{await syncNow("setup");toast("云同步已开启 ☁");VIEWS.me()}catch(e){_storeSet("lgf-sync",prev.token?prev:{});VIEWS.me();const s=$("#syncst");if(s)s.innerHTML=`<b style="color:var(--warn)">没开启成功：${esc(syncErr(e))}</b>`}};
  const go=$("#syncgo");if(go)go.onclick=async()=>{go.disabled=true;try{await syncNow("manual");toast("同步完成 ☁")}catch(e){toast(syncErr(e))}finally{const g=$("#syncgo");if(g)g.disabled=false}};
  const off=$("#syncoff");if(off)off.onclick=()=>{if(off.dataset.sure!=="1"){off.dataset.sure="1";off.textContent="确定关闭？";setTimeout(()=>{off.dataset.sure="";off.textContent="关闭同步"},4000);return}
    _storeSet("lgf-sync",{});try{localStorage.removeItem("lgf-sync-st")}catch(e){}toast("已关闭同步。这台设备和云端的数据都还在。");VIEWS.me()}}
/* triggers */
addEventListener("load",()=>setTimeout(()=>syncNow("start"),1500));
document.addEventListener("visibilitychange",()=>{if(!syncOn())return;if(document.hidden){metaSave();if(dirtyAt)syncNow("hide")}else if(Date.now()-(syncCfg().last||0)>120000)syncNow("show")});
addEventListener("online",()=>syncNow("online"));addEventListener("pagehide",metaSave);

addEventListener("hashchange",route);
try{speechSynthesis.getVoices()}catch(e){}
route();
</script>
